apply plugin: 'com.android.application'

// ---- Auto-incrementing app version ----
// Reads android/version.properties, bumps the version on every build:
//   versionName goes 1.0 -> 1.1 -> ... -> 1.9 -> 2.0 -> 2.1 ...
//   versionCode increments by 1 each build.
def versionPropsFile = file('../version.properties')
def autoVersionCode = 1
def autoVersionName = "1.0"
// Only bump when an actual build/assemble/bundle task is requested,
// so IDE syncs don't inflate the version.
def isBuildInvocation = gradle.startParameter.taskNames.any { name ->
    def n = name.toLowerCase()
    n.contains('assemble') || n.contains('bundle') || n.contains('build') || n.contains('install')
}
if (versionPropsFile.exists()) {
    def versionProps = new Properties()
    versionPropsFile.withInputStream { versionProps.load(it) }

    def code = (versionProps['VERSION_CODE'] ?: '1').toInteger()
    def major = (versionProps['VERSION_MAJOR'] ?: '1').toInteger()
    def minor = (versionProps['VERSION_MINOR'] ?: '0').toInteger()

    if (isBuildInvocation) {
        // Bump for this build
        code += 1
        minor += 1
        if (minor > 9) {
            minor = 0
            major += 1
        }
        versionProps['VERSION_CODE'] = code.toString()
        versionProps['VERSION_MAJOR'] = major.toString()
        versionProps['VERSION_MINOR'] = minor.toString()
        versionProps.store(versionPropsFile.newWriter(), null)
    }

    autoVersionCode = code
    autoVersionName = "${major}.${minor}"
}

android {
    namespace = "com.geologon.cuiz"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.geologon.cuiz"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode autoVersionCode
        versionName autoVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Unity LevelPlay (ironSource) mediation SDK
    implementation 'com.unity3d.ads-mediation:mediation-sdk:8.+'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.2.0'
    implementation 'com.google.android.gms:play-services-appset:16.1.0'
    implementation 'com.google.android.gms:play-services-basement:18.7.2'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Workaround for IDE/Gradle sync issues when Kotlin is requested
task prepareKotlinBuildScriptModel { }

